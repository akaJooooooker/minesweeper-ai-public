[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minesweeper-ai"
version = "0.1.0"
license = "MIT"
authors = [{name = "akaJooooooker"}]
description = "Size-independent Minesweeper environment, exact constraint teacher, and neural policy baseline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0"]

[project.optional-dependencies]
ml = ["torch==2.12.1"]
desktop = ["Pillow>=11.0"]

[project.scripts]
minesweeper-ai = "minesweeper_ai.cli:main"
minesweeper-desktop = "minesweeper_ai.desktop_app:main"
minesweeper-local = "minesweeper_ai.local_app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
